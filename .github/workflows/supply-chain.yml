name: Supply Chain

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supply-chain.yml'
  schedule:
    # Weekly SBOM refresh + vulnerability scan
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 90

  npm-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    # Advisory until the baseline is clean: does not block merges, but
    # results are visible on every PR that touches dependencies.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm audit (high and critical)
        run: npm audit --audit-level=high
